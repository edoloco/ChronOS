plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.mesadoble'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.mesadoble'
        minSdk 28
        targetSdk 34
        // número de versión basado en fecha y hora: siempre crece, aunque cambie el archivo de compilación
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
    }

    // Dos versiones: "completa" (cambio de teclado automático, usa accesibilidad)
    // y "liviana" (sin permisos sensibles; Play Protect no la bloquea)
    flavorDimensions "version"
    productFlavors {
        completa { dimension "version" }
        liviana { dimension "version"; versionNameSuffix "-liviana" }
    }

    signingConfigs {
        // Llave fija para que cada nueva versión se instale encima de la anterior
        fija {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
