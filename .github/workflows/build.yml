name: Compilar ChronOS

# Cada envío a main compila las dos versiones (completa y liviana) y las publica como una versión nueva.
# El número sale de la hora de compilación: una versión nueva siempre es "más nueva" que la anterior.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Número de versión
        run: |
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> $GITHUB_ENV
          echo "VERSION_NAME=1.$(TZ=America/Santiago date +%y%m%d.%H%M)" >> $GITHUB_ENV
          echo "NOTA=$(git log -1 --pretty=%s | head -c 300)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Preparar APKs
        run: |
          cp app/build/outputs/apk/completa/release/*.apk MesaDoble-completa.apk
          cp app/build/outputs/apk/liviana/release/*.apk MesaDoble-liviana.apk

      - name: Paquete para el sistema (TWRP)
        run: |
          mkdir -p sistema/system/priv-app/ChronOS
          cp MesaDoble-completa.apk sistema/system/priv-app/ChronOS/ChronOS.apk
          cd sistema && zip -r -X ../ChronOS-sistema.zip META-INF system

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: ChronOS ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            MesaDoble-liviana.apk
            MesaDoble-completa.apk
            ChronOS-sistema.zip
          body: |
            Versión ${{ env.VERSION_NAME }}. Incluye: ${{ env.NOTA }}
            MesaDoble-liviana.apk: sin permisos sensibles, Play Protect no la bloquea. Sirve para ambos teléfonos.
            MesaDoble-completa.apk: versión con accesibilidad (cambio de teclado, centro de apagado, mesa de dibujo).
            ChronOS-sistema.zip: para flashear desde TWRP encima de una ROM (por ejemplo en el J7 Prime): ChronOS como app del sistema, extendido de fábrica.
