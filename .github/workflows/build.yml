name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MesaDoble.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mesa Doble 1.0.${{ github.run_number }}
          make_latest: true
          files: MesaDoble.apk
          body: |
            Descarga **MesaDoble.apk** en ambos teléfonos e instálalo.
            Enlace directo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/MesaDoble.apk
